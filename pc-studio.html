  resetRun(); fitView();
}

function loadSpec(sp, name) {
  spec = JSON.parse(JSON.stringify(sp));
  if (!spec.dims) spec.dims = [64];
  if (name !== undefined) {
    curName = name;
    document.title = 'pc-studio' + (name ? ' · ' + name : ' · 预测编码图编辑器');

  afterLoad();
}

const HELP = `操作
· 左键单击组件 = 选中；Shift/⌘ + 单击 = 加选；左键拖空白 = 框选（可框多个）
· 右键（或中键）拖动 = 平移视图；滚轮 = 以光标为中心缩放
· 右键组件 = 删除 / 复制 / 粘贴；⌘C / ⌘V 也行；画布空白右键 = 粘贴到这里
· Delete 删除选中；点连线可以删掉这条线；右下角滑块 / ⤢ = 缩放 / 适应画布
· 顶栏右侧「左栏 / 右栏」可以收起两侧面板（不影响图纸内容）

图
1. 组件库在左边：点「组件」展开/收起；点一下组件 = 放到画布中央，也可以直接拖进来。
2. 连线：从组件右侧的圆点拖到另一个组件左侧的圆点。
3. 状态组件（x / 后验 μ / 权重 θ / 偏置 β / 误差 ε / 中间量）的名字和形状都自己定：
   选中后在右边「检视器」里改「名称」「形状 r × c」。连上算子之后，算子会按你的形状
   自动校验，形状对不上会在组件上直接标红报错。
4. 状态组件的左边是「写」、右边是「读」。op 的输出连到状态组件的左边 = 原地写回那块内存
   （例如 AXPY 的输出连到 M[1] 的左边，就是 M[1] += η·Δμ）。
5. 「监视」组件：把一个张量画成方阵热力图（列数取 √n 向上取整），接在哪个状态的
   「读」口上就画它。跟运行无关，只做显示。
6. EM 是「集成」组件：接 μ（1×n 行向量）和 θ（Du×n），f/ε 是下层预测与本层误差，
   μ′/θ′/β′ 是写回的新值，接回状态组件的左边。

文件
7. 文件 → 保存（⌘S）直接写回你打开/上次另存的那个本地 .json；没有文件时弹保存框。
   另存为… = 选个新位置；加载图纸（⌘O）= 选本地 .json 打开。
8. 导出的 JSON / C++ 弹窗里也有「保存…」，可以直接存成 .json / .hpp。
9. 运行：▶ 开始，F 曲线是自由能，重建误差 ‖ε₀‖² 越小说明重建越好。
10. 导出 C++ 把当前图变成一段 build() 代码，用的是 engine/pc.hpp；种子一致时和界面里
    跑出来的数一样（examples/pc_basic.cpp 会核对）。
`;

    // 3) 缩放条
    const r = document.querySelector('#z-range');
    r.value = 150; r.dispatchEvent(new Event('input', { bubbles: true }));
    log('zoom-k', view.k.toFixed(2), 'label', document.querySelector('#z-val').textContent);

    // 4) 滚轮（灵敏度取自设置）
    const k0 = view.k;
    document.querySelector('#stage').dispatchEvent(new WheelEvent('wheel', { deltaY: -100, clientX: 700, clientY: 400, bubbles: true, cancelable: true }));
    log('wheel-dir', view.k > k0 ? 'in' : 'out', 'k', view.k.toFixed(3), 'sens', settings.wheel);

    // 5) 左右栏开关
    document.querySelector('#btn-left').click();
    log('left-hidden', document.querySelector('#main').classList.contains('hide-left'));
    document.querySelector('#btn-left').click();
    document.querySelector('#btn-right').click();
    log('right-hidden', document.querySelector('#main').classList.contains('hide-right'), 'ops-badge-kept', document.querySelector('#b-ops').textContent.trim());
    document.querySelector('#btn-right').click();

    // 6) 设置浮窗 + 折叠组件库
    document.querySelector('#ls-head').click();
    log('setpop-open', document.querySelector('#setpop').classList.contains('on'));
    const w0 = settings.wheel;
    const wr = document.querySelector('#set-body input[type=range]');
    wr.value = 24; wr.dispatchEvent(new Event('input', { bubbles: true }));
    log('wheel-sens', w0, '->', settings.wheel);
    document.querySelector('#set-close').click();
    document.querySelector('#lc-head').click();
    log('palette-collapsed', !document.querySelector('#lc-body').classList.contains('open'));
    document.querySelector('#lc-head').click();

    // 7) 监视组件：拖一个上去，接到 E0，出方阵
    const mon = addNode('MON', { x: 980, y: 640 });
    connect('E0', 'out', mon.id, 'v');
    log('mon-cells', document.querySelectorAll(`.mon[data-mon="${mon.id}"] i`).length, 'tensor', (rt.views[mon.id] || {}).name);

    // 8) 改形状 → 校验报错
    const m1 = spec.nodes.find(n => n.type === 'M' && (n.l || 0) === 1);
    const c0 = PC.stateShape(spec, m1).c;
    m1.shape = { r: 1, c: c0 + 5 };
    resetRun();
    log('shape-error', (rt.errors[0] || {}).msg || '无');

    // 9) 右键菜单 → 复制 → 粘贴
    const msgs = [];
    const oldToast = toast;
    toast = t => { msgs.push(t); oldToast(t); };
    selectNode(mon.id);
    const b1 = document.querySelector(`.node[data-id="${mon.id}"]`);
    const bb = b1.getBoundingClientRect();
    b1.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: bb.left + 20, clientY: bb.top + 10 }));
    log('ctx-items', [...document.querySelectorAll('#ctxmenu .ci')].map(d => d.textContent.trim()).join('|'));
    document.querySelectorAll('#ctxmenu .ci')[1].click();
    log('copied', clip ? clip.nodes.length : 0);
    const nBefore = spec.nodes.length;
    pasteClip();
    log('pasted', nBefore, '->', spec.nodes.length, 'sel', selSet.size);
    toast = oldToast;

    // 10) 示例图纸从菜单切
    document.querySelector('#btn-file').click();
    document.querySelector('#filemenu .mi[data-act="ex1"]').click();
    log('example3-ops', document.querySelector('#b-ops').textContent.trim(), 'nodes', spec.nodes.length);
    document.querySelector('#btn-file').click();
    document.querySelector('#filemenu .mi[data-act="ex2"]').click();
    log('example1-ops', document.querySelector('#b-ops').textContent.trim(), 'nodes', spec.nodes.length);

    log('canFS', canFS, 'save-as-test', typeof saveTextAs);

    // 12) 新建图纸
    newDrawing();
    log('new-nodes', spec.nodes.length, 'ops', document.querySelector('#b-ops').textContent.trim());
    loadPreset(0);

    // 13) 右键拖动不弹菜单；右键单击才弹
    clip = { nodes: [spec.nodes[0]], edges: [] };
    fire('mousedown', 1250, 860, { button: 2 });
    log('pan-start', drag && drag.kind);
    fire('mousemove', 1300, 890);
    fire('mouseup', 1300, 890, { button: 2 });
    log('ctx-after-rightdrag', document.querySelector('#ctxmenu').classList.contains('on'));
    fire('mousedown', 1250, 860, { button: 2 });
    fire('mouseup', 1250, 860, { button: 2 });
    log('ctx-after-rightclick', document.querySelector('#ctxmenu').classList.contains('on'));
    hideCtx();

    // 14) 剪刀：横着划一条线剪断连线
    setMode('scissor');
    log('mode', mode);
    const paths = [...document.querySelectorAll('#wires path.hit')];
    const pathEl = paths[paths.length - 1];
    const mid = pathEl.getPointAtLength(pathEl.getTotalLength() * 0.5);
    const st2 = document.querySelector('#stage').getBoundingClientRect();
    const cx = mid.x * view.k + view.x + st2.left, cy = mid.y * view.k + view.y + st2.top;
    const nEdges = spec.edges.length;
    const wires = document.querySelector('#wires');
    wires.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: cx - 26, clientY: cy, button: 0 }));
    window.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: cx, clientY: cy }));
    window.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: cx + 26, clientY: cy }));
    window.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, clientX: cx + 26, clientY: cy, button: 0 }));
    log('scissor-cut', nEdges, '->', spec.edges.length);
    setMode('select');
    log('mode-back', mode);

    // 11) 多选 + Delete
    setSelection(spec.nodes.slice(0, 2).map(n => n.id));
    const n0 = spec.nodes.length;
    deleteSelected();
    log('delete', n0, '->', spec.nodes.length);
  } catch (e) { console.log('TEST ERROR ' + e.message + ' @ ' + (e.stack || '').split('\n')[1]); }
}, 250);
})();
</script>
</body>
</html>
